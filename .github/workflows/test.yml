name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: node scripts/build.mjs
      - name: Size budgets
        run: npm run size
      - name: Editors' reference up to date
        run: node scripts/editor-docs.mjs --check
      - name: PHP syntax
        run: for f in $(git ls-files 'plugins/*.php'); do php -l "$f" || exit 1; done
      # WordPress's coding standards, with the security and database checks
      # WordPress.org's Plugin Check runs, and PHP 7.4 compatibility
      # (phpcs.xml.dist).
      - name: PHP coding standards
        run: composer install --no-interaction --no-progress && composer lint:php
      - name: Editor script syntax
        run: node --check plugins/wordpress/src/editor.js && node --check plugins/wordpress/src/page.js
